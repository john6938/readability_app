name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: readability-client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: readability-client

      - name: Build (GitHub Pages)
        run: npm run build
        working-directory: readability-client
        env:
          BASE_URL: /readability_app/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: readability-client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# ── cPanel / GoDaddy build (run locally) ────────────────────────────────────
# To build for cPanel deployment, run from readability-client/:
#   BASE_URL=/ npm run build          (if hosted at domain root)
#   BASE_URL=/tools/readability/ npm run build   (if in a subdirectory)
# Then upload the contents of readability-client/dist/ via File Manager or FTP.
